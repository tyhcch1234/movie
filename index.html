<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>影片庫</title>
<meta name="description" content="AI 重構畫面短片作品集">
<style>
  :root{
    --bg:#0a0b0e; --panel:#14161b; --line:#23262e;
    --fg:#f2f3f5; --dim:#9aa0ab; --accent:#e0684a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font-family:"Noto Sans TC","PingFang HK","Microsoft JhengHei",system-ui,-apple-system,sans-serif}
  body{min-height:100vh;background:
    radial-gradient(1200px 600px at 70% -10%, rgba(224,104,74,.10), transparent 60%),
    radial-gradient(900px 500px at 10% 0%, rgba(70,110,190,.10), transparent 60%), var(--bg);}
  header{padding:clamp(28px,6vw,64px) clamp(18px,5vw,56px) 0;max-width:1400px;margin:0 auto}
  .eyebrow{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);margin:0 0 12px}
  h1{font-size:clamp(30px,6vw,54px);margin:0;letter-spacing:.02em;font-weight:800}
  .tagline{color:var(--dim);margin:12px 0 0;font-size:clamp(13px,2.6vw,16px)}
  .stats{display:flex;gap:22px;flex-wrap:wrap;margin-top:22px;color:var(--dim);font-size:13px}
  .stats b{color:var(--fg);font-weight:700;font-size:15px;margin-left:5px}
  .rule{height:1px;background:var(--line);margin:clamp(22px,4vw,40px) 0 0}
  main{max-width:1400px;margin:0 auto;padding:clamp(22px,4vw,40px) clamp(18px,5vw,56px) 90px}
  .grid{display:grid;gap:clamp(16px,2.4vw,26px);
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;
    cursor:pointer;transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease;
    display:flex;flex-direction:column}
  .card:hover{transform:translateY(-4px);border-color:#3a3f4a;box-shadow:0 18px 40px rgba(0,0,0,.5)}
  .thumb{position:relative;aspect-ratio:9/16;background:#000;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease,opacity .3s}
  .card:hover .thumb img{transform:scale(1.04);opacity:.85}
  .play{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
  .play span{width:56px;height:56px;border-radius:50%;background:rgba(10,11,14,.62);
    border:1.5px solid rgba(255,255,255,.75);backdrop-filter:blur(3px);
    display:grid;place-items:center;transition:transform .25s ease,background .25s ease}
  .play span::after{content:"";width:0;height:0;margin-left:4px;
    border-left:15px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent}
  .card:hover .play span{transform:scale(1.08);background:rgba(224,104,74,.85);border-color:transparent}
  .badge{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.72);color:#fff;
    font-size:11px;padding:3px 8px;border-radius:6px;font-variant-numeric:tabular-nums;letter-spacing:.04em}
  .body{padding:14px 15px 16px;display:flex;flex-direction:column;gap:7px;flex:1}
  .title{font-size:15.5px;font-weight:700;line-height:1.35;margin:0}
  .meta{font-size:11.5px;color:var(--dim);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .meta .dot{width:3px;height:3px;border-radius:50%;background:#4a4f59}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
  .tag{font-size:10.5px;color:#c9ced8;background:#1d2028;border:1px solid #2b2f38;
    padding:2px 7px;border-radius:999px}
  .note{margin-top:auto;font-size:10.5px;color:#7d838e;padding-top:8px;line-height:1.5}
  footer{max-width:1400px;margin:0 auto;padding:0 clamp(18px,5vw,56px) 60px;color:#6f7581;font-size:12px;line-height:1.8}
  /* 播放器 */
  #player{position:fixed;inset:0;background:rgba(4,5,7,.96);display:none;
    place-items:center;z-index:50;padding:16px;backdrop-filter:blur(6px)}
  #player.on{display:grid}
  #player .box{width:min(100%,480px);position:relative}
  #player video{width:100%;max-height:82vh;display:block;border-radius:14px;background:#000}
  #player .cap{margin-top:14px;color:var(--dim);font-size:12.5px;line-height:1.6;padding-right:44px}
  #player .cap b{color:var(--fg);display:block;font-size:14.5px;margin-bottom:4px}
  #close{position:absolute;top:-6px;right:-6px;width:38px;height:38px;border-radius:50%;
    background:#1b1e24;border:1px solid #333;color:#fff;font-size:19px;cursor:pointer;line-height:1}
  .empty{color:var(--dim);font-size:14px;padding:40px 0}
</style>
</head>
<body>
<header>
  <p class="eyebrow">Video Library</p>
  <h1 id="siteTitle">影片庫</h1>
  <p class="tagline" id="siteTagline"></p>
  <div class="stats">
    <div>作品<b id="cnt">—</b></div>
    <div>總時長<b id="total">—</b></div>
    <div>更新<b id="updated">—</b></div>
  </div>
  <div class="rule"></div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" style="display:none">載入不到片庫清單。</p>
</main>

<footer>
  <div id="foot"></div>
</footer>

<div id="player" aria-hidden="true">
  <div class="box">
    <button id="close" aria-label="關閉">×</button>
    <video id="vid" controls playsinline preload="metadata"></video>
    <div class="cap"><b id="pTitle"></b><span id="pDesc"></span></div>
  </div>
</div>

<script>
const fmt = s => {
  s = Math.round(s || 0);
  const m = Math.floor(s/60), r = s%60;
  return m ? `${m}:${String(r).padStart(2,'0')}` : `0:${String(r).padStart(2,'0')}`;
};

fetch('videos.json', {cache:'no-store'})
  .then(r => r.json())
  .then(data => {
    const site = data.site || {};
    document.getElementById('siteTitle').textContent = site.title || '影片庫';
    document.getElementById('siteTagline').textContent = site.tagline || '';
    document.title = site.title || '影片庫';

    const list = (data.videos || []).sort((a,b) => (b.date||'').localeCompare(a.date||''));
    if (!list.length) throw new Error('empty');

    const grid = document.getElementById('grid');
    list.forEach(v => {
      const card = document.createElement('article');
      card.className = 'card';
      card.innerHTML = `
        <div class="thumb">
          <img loading="lazy" src="${v.poster}" alt="${v.title}">
          <div class="play"><span></span></div>
          <div class="badge">${fmt(v.duration)}</div>
        </div>
        <div class="body">
          <h2 class="title">${v.title}</h2>
          <div class="meta">
            <span>${v.date || ''}</span>
            ${v.ratio ? `<span class="dot"></span><span>${v.ratio}</span>` : ''}
            ${v.size ? `<span class="dot"></span><span>${v.size}</span>` : ''}
          </div>
          ${v.tags ? `<div class="tags">${v.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>` : ''}
          <div class="note">${v.note || ''}</div>
        </div>`;
      card.addEventListener('click', () => openPlayer(v));
      grid.appendChild(card);
    });

    document.getElementById('cnt').textContent = list.length + ' 段';
    const total = list.reduce((n,v) => n + (v.duration||0), 0);
    document.getElementById('total').textContent = fmt(total);
    document.getElementById('updated').textContent = list[0].date || '—';
    document.getElementById('foot').innerHTML =
      `畫面為 AI 重構，非真實影像。　所有內容僅供紀錄與教育用途。`;
  })
  .catch(() => {
    document.getElementById('empty').style.display = 'block';
  });

const player = document.getElementById('player');
const vid = document.getElementById('vid');
function openPlayer(v){
  vid.src = v.src;
  vid.poster = v.poster;
  document.getElementById('pTitle').textContent = v.title;
  document.getElementById('pDesc').textContent = v.description || '';
  player.classList.add('on');
  player.setAttribute('aria-hidden','false');
  vid.play().catch(()=>{});
}
function closePlayer(){
  vid.pause(); vid.removeAttribute('src'); vid.load();
  player.classList.remove('on');
  player.setAttribute('aria-hidden','true');
}
document.getElementById('close').addEventListener('click', closePlayer);
player.addEventListener('click', e => { if (e.target === player) closePlayer(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePlayer(); });
</script>
</body>
</html>
